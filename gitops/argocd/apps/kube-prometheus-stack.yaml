apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 62.7.0
    helm:
      values: |
        grafana:
          adminPassword: prom-operator
          service:
            type: ClusterIP
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 100m, memory: 256Mi }
        alertmanager:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # this chart's CRDs (Prometheus, Alertmanager, ...) exceed the 262144-byte
      # last-applied-configuration annotation limit for client-side apply;
      # ServerSideApply alone wasn't honored for CRDs on this ArgoCD version, so
      # fall back to Replace (safe here since CRDs carry no data of their own).
      - ServerSideApply=true
      - Replace=true
