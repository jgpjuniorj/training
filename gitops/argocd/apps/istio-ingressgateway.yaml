apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/jgpjuniorj/training.git
    targetRevision: main
    path: vendor-charts/istio-gateway
    # NOTE: vendored locally (values.schema.json removed) because the upstream chart's
    # schema rejects its own internal "_internal_defaults_do_not_set" key under the
    # stricter Helm v4 engine bundled with recent ArgoCD versions (repo-server uses
    # Helm v4, which is stricter than the Helm v3 CLI used locally for development).
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
