apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iris-classifier
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/jgpjuniorj/training.git
    targetRevision: main
    path: apps/iris-classifier/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: iris-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
