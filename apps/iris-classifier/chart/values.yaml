image:
  repository: iris-classifier
  tag: local
  pullPolicy: IfNotPresent

namespace: iris-demo
createNamespace: true

service:
  port: 80
  targetPort: 8000

gateway:
  enabled: true
  # NOTE: must be a concrete host, not "*" - Istio's validation webhook rejects a
  # wildcard host on a VirtualService that is also bound to the implicit "mesh"
  # gateway (used here for in-mesh calls to the FQDN). Use this Host header when
  # calling through the ingress gateway, e.g. curl -H "Host: iris.kiale.local" ...
  host: "iris.kiale.local"

# two versions of the same app so we can demo Istio weighted traffic-splitting
# and see both nodes/edges live in the Kiali graph.
# memory limits are generous for such a tiny model because scikit-learn/numpy/scipy
# alone need ~150-250Mi RSS at import time - anything lower gets OOMKilled (exit 137).
versions:
  - name: v1
    weight: 90
    replicas: 2
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  - name: v2
    weight: 10
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits: { cpu: 750m, memory: 512Mi }

serviceMonitor:
  enabled: true
  interval: 15s

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
