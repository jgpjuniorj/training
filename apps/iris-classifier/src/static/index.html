<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Iris Classifier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin-top: .75rem; font-size: .9rem; }
    input { width: 100%; padding: .4rem; box-sizing: border-box; }
    button { margin-top: 1.25rem; padding: .6rem 1.2rem; cursor: pointer; }
    #result { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; background: #f4f4f4; white-space: pre-wrap; font-size: .9rem; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; background: #2563eb; color: #fff; font-size: .75rem; }
  </style>
</head>
<body>
  <h1>🌸 Iris Classifier <span class="badge" id="version-badge">?</span></h1>
  <p>Modelo simples (scikit-learn) rodando no cluster. Preenche as medidas da flor e clica em prever.</p>

  <form id="form">
    <label>Sepal length (cm) <input name="sepal_length" type="number" step="0.1" value="5.1" required></label>
    <label>Sepal width (cm)  <input name="sepal_width"  type="number" step="0.1" value="3.5" required></label>
    <label>Petal length (cm) <input name="petal_length" type="number" step="0.1" value="1.4" required></label>
    <label>Petal width (cm)  <input name="petal_width"  type="number" step="0.1" value="0.2" required></label>
    <button type="submit">Prever espécie</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const badge = document.getElementById("version-badge");

    async function refreshHealth() {
      const res = await fetch("/healthz");
      const data = await res.json();
      badge.textContent = data.model_version;
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const payload = Object.fromEntries(
        [...new FormData(form).entries()].map(([k, v]) => [k, parseFloat(v)])
      );
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      result.textContent = JSON.stringify(data, null, 2);
      badge.textContent = data.model_version;
    });

    refreshHealth();
  </script>
</body>
</html>
